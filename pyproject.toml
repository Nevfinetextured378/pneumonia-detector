[project]
name = "pneumonia-detector"
version = "0.1.0"
description = "基于深度学习的胸部X光肺炎辅助检测系统"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "3495735391-cyber" }
]
keywords = ["deep-learning", "medical-imaging", "pneumonia-detection", "chest-xray", "pytorch", "resnet", "grad-cam", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "tensorboard>=2.13",
    "jupyter>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[tool.uv]
dev-dependencies = []
